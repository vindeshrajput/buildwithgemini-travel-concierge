<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<!-- Material Symbols for icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #f0fdfa;
    --bg: #f8fafc;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #0f766e, #0284c7);
    color: #fff;
    padding: 0.9rem 1.5rem;
    font-weight: 700;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.15);
    z-index: 10;
  }
  .app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    height: calc(100vh - 60px);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  /* Custom scrollbar styling */
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  /* Welcome Banner */
  .welcome-card {
    background: #ffffff;
    border: 1px solid #ccfbf1;
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    box-shadow: 0 4px 15px rgba(13, 148, 136, 0.05);
    margin-bottom: 0.5rem;
  }
  .welcome-card h2 { margin: 0 0 0.5rem; color: var(--accent-dark); font-size: 1.3rem; }
  .welcome-card p { margin: 0; color: var(--text-secondary); font-size: 0.92rem; line-height: 1.5; }

  /* Dialogue Messages */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.35rem;
  }
  .meta .avatar { font-size: 0.9rem; }

  .bubble {
    padding: 0.8rem 1.1rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
    color: #ffffff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(13, 148, 136, 0.2);
  }
  .msg.agent .bubble {
    background: #ffffff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    color: var(--text-primary);
    border-top-left-radius: 4px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }
  /* Rich A2UI Card inside agent bubble */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    width: 100%;
    white-space: normal;
  }

  /* Example Prompts Bar */
  .prompts-bar {
    display: flex;
    gap: 0.6rem;
    padding: 0.4rem 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .prompt-chip {
    background: #ffffff;
    border: 1px solid #ccfbf1;
    color: var(--accent-dark);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.5rem 0.95rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.08);
  }
  .prompt-chip:hover {
    background: linear-gradient(135deg, #0f766e, #0284c7);
    color: #ffffff;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 118, 110, 0.25);
  }

  /* Input Box */
  form {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.6rem 0.5rem 1.2rem;
    margin: 0.5rem 1rem 1.2rem;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 32px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 6px 24px rgba(13, 148, 136, 0.15);
  }
  input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
  }
  input::placeholder { color: #94a3b8; }
  
  button.send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #0f766e, #0284c7);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 10px rgba(15, 118, 110, 0.25);
  }
  button.send-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 5px 15px rgba(15, 118, 110, 0.35);
  }

  /* A2UI Component Styles */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.2rem; background:#fff; box-shadow:0 4px 15px rgba(0,0,0,0.05); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.7rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.4rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h2 { font-size:1.2rem; font-weight:700; color:var(--text-primary); }
  .a2text.a2-h3 { font-size:1.05rem; font-weight:600; color:var(--text-primary); }
  .a2text.a2-h4 { font-size:0.95rem; font-weight:600; color:var(--text-primary); }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-secondary); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header><span>✈️</span> Travel Concierge</header>

<div class="app-container">
  <div id="log">
    <div class="welcome-card">
      <h2>🌴 Welcome to Travel Concierge</h2>
      <p>I can help you search destinations, calculate travel budgets, check weather, and generate visual postcard images. Click a quick prompt below or ask anything!</p>
    </div>
  </div>
  
  <div class="prompts-bar">
    <button class="prompt-chip" type="button" onclick="sendPrompt('Search destinations for tropical beaches')">🏖️ Tropical beaches</button>
    <button class="prompt-chip" type="button" onclick="sendPrompt('Calculate budget for 5 days in Tokyo')">🗼 5-day Tokyo budget</button>
    <button class="prompt-chip" type="button" onclick="sendPrompt('Generate a postcard image of Paris')">🎨 Postcard of Paris</button>
  </div>
  
  <form id="form">
    <input id="input" placeholder="Ask Travel Concierge anything…" autocomplete="off" autofocus>
    <button class="send-btn" type="submit" title="Send message">
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.3rem;">arrow_upward</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const meta = el("div", "meta");
  const avatar = el("span", "avatar", who === "user" ? "👤" : "✈️");
  const label = el("span", null, who === "user" ? "You" : "Travel Concierge");
  meta.appendChild(avatar);
  meta.appendChild(label);
  m.appendChild(meta);

  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
